# Do the SOSO, Croissant and OHDSI mapping tables still describe what the converters do?
#
# These converters carry SSSOM tables that document, rather than drive, the
# conversion (SOSO and OHDSI do not read their tables at all; Croissant reads
# its own but much of the structural work is in code). So the table and the code can
# drift apart with nothing to report it -- a renamed property, a moved path, a
# term the converter carries that no row mentions, a subject_class filed on the
# wrong class. All of it looks exactly like the mapping simply not being there.
#
# The two checkers make that drift loud and exit non-zero on it. Both need no
# third-party packages -- the converters guard their detect_conformance import
# and the checks run with detection off -- so this job cannot go red for a
# reason unrelated to what it checks (and needs no submodule checkout).

name: check-mappings

on:
  workflow_dispatch:
  push:
    paths:
      - "soso/ConvertToSOSO.py"
      - "soso/ConvertFromSOSO.py"
      - "soso/check_soso_mappings.py"
      - "soso/examples/**"
      - "croissant/ConvertToCroissant.py"
      - "croissant/ConvertFromCroissant.py"
      - "croissant/check_croissant_mappings.py"
      - "croissant/croissantExamples/**"
      - "croissant/MLCroissantExamples/**"
      - "OHDSI/harvest_ohdsi_to_cdif.py"
      - "OHDSI/check_ohdsi_mappings.py"
      - "OHDSI/OHDSIMetadata/**"
      - "sssom_engine.py"
      - "mappings/*.sssom.tsv"
      - ".github/workflows/check-mappings.yml"
  pull_request:
    paths:
      - "soso/ConvertToSOSO.py"
      - "soso/ConvertFromSOSO.py"
      - "soso/check_soso_mappings.py"
      - "soso/examples/**"
      - "croissant/ConvertToCroissant.py"
      - "croissant/ConvertFromCroissant.py"
      - "croissant/check_croissant_mappings.py"
      - "croissant/croissantExamples/**"
      - "croissant/MLCroissantExamples/**"
      - "OHDSI/harvest_ohdsi_to_cdif.py"
      - "OHDSI/check_ohdsi_mappings.py"
      - "OHDSI/OHDSIMetadata/**"
      - "sssom_engine.py"
      - "mappings/*.sssom.tsv"
      - ".github/workflows/check-mappings.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check SOSO mapping tables against the converters
        run: python soso/check_soso_mappings.py

      - name: Check Croissant mapping tables against the converters
        run: python croissant/check_croissant_mappings.py

      - name: Check the OHDSI mapping table against the converter
        run: python OHDSI/check_ohdsi_mappings.py
