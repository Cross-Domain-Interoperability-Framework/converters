mapping_set_id: https://w3id.org/cdif/mappings/disco-to-cdif
mapping_set_title: DDI-RDF Discovery Vocabulary (Disco) to CDIF
mapping_set_description: |
  Term correspondences from the DDI-RDF Discovery Vocabulary (Disco) to CDIF.

  DRAFT, UNREVIEWED. No converter reads this table yet -- unlike the other sets
  here it documents no implementation, so there is nothing for CI to check it
  against. It is a crosswalk worksheet: every Disco class and property is
  enumerated whether or not CDIF has a target, in the manner of the three DDI
  Codebook sets, so that the gaps are visible rather than merely absent.

  Lineage matters here and is easy to get wrong. Disco is a simplified RDF
  projection of DDI-Codebook and DDI-Lifecycle; CDIF's `cdi:` namespace is
  DDI-CDI, a different and later DDI standard. The two are sibling descendants
  of different DDI generations, not one vocabulary reused -- so
  disco:RepresentedVariable and cdi:RepresentedVariable denote the same DDI
  concept arriving by two routes. The vocabulary dates from the 2011-2013
  Dagstuhl work (see the spec's acknowledgements); the 2026-06-26 header is a
  republication.

  Disco's own source content is ALREADY mapped from its XML form by
  ddi-common-to-cdif / ddi25-to-cdif / ddi122-to-cdif. This set is therefore not
  new semantic ground: it is the serialization a Linked Data publisher exposes,
  where those three cover the Codebook XML a repository holds.

  Two Disco terms are already in use in CDIF, as the schema:propertyID IRI of a
  schema:PropertyValue rather than as properties: discovery#caseQuantity and
  discovery#variableQuantity. They appear in CDIF example records and in
  DDI-CDI/ddicdi_jsonld_to_cdif.py (count_property). Those rows are marked
  "ALREADY IN USE"; this set is the first place that usage is written down.
