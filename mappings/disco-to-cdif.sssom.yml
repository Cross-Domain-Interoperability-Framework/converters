comment: |
  66 rows: 43 with a CDIF target, 23 without. The inventory is the UNION of the
  spec's Vocabulary Reference appendix, its section 11 mapping tables and its
  narrative, because none of the three is complete on its own -- the appendix
  omits roughly half the properties the narrative uses (kindOfData, startDate,
  endDate, fundedBy, instrument, dataFile, representation, purpose, subtitle and
  the ten named statistic properties among them).

  subject_class disambiguates, as in dcat-to-cdif: Disco is a graph and the same
  property means different things by class. disco:variable is declared on both
  Study and LogicalDataSet; disco:universe over six domains. A blank
  subject_class on a row whose subject_id is a class means the subject IS the
  class.

  There is no `transform` column. The other converter sets use it to name the
  shaper the converter applies, and there is no Disco converter to name one in.

  No author_id / reviewer_id: nothing here has been reviewed, and the DDI sets'
  convention of stamping an ORCID into both columns would misreport that.

  The three structural incompatibilities, none of which a row can express on its
  own:

  1. Different base class. disco:LogicalDataSet is rdfs:subClassOf dcat:Dataset
     and disco:DataFile a subclass of dcat:Distribution; CDIF roots on
     schema:Dataset and schema:DataDownload. Neither pair is a subclass of the
     other, so Disco and CDIF cannot be blended in one node -- every row across
     that boundary is skos:closeMatch at best, and a translation is required.

  2. dcat:CatalogRecord means something else. The spec's EXAMPLE 33 co-types a
     disco:Study as a dcat:CatalogRecord carrying foaf:primaryTopic. CDIF uses
     dcat:CatalogRecord strictly as the node schema:subjectOf points AT, and
     cdifd:CDIFSubjectOfPlacementShape (cdifCore/rules.shacl) requires that the
     subject NOT itself be a dcat:CatalogRecord. A Disco graph following that
     example trips a Violation-severity CDIF shape.

  3. Statistics are shaped differently. Disco gives each statistic its own named
     property; CDIF gives one shape -- cdif:typeOfStatistic naming the kind, the
     number in cdi:content. Disco-to-CDIF is mechanical; CDIF-to-Disco only
     works where the statistic type falls inside Disco's closed set of ten.

  Direction. Disco-to-CDIF is the useful direction and the only one Disco itself
  endorses ("the vice-versa process is not intended", spec section 2.1). A
  CDIF-to-Disco set would be worth the discovery subset only: everything
  `cdi:`-structural (wide/long/dimensional structures, physical mappings, keys)
  has no Disco target at all.

  Declared loss, Disco to CDIF. Universe, AnalysisUnit, Instrument,
  Questionnaire, Question, questionText, responseDomain, collectionMode,
  StudyGroup/inGroup, aggregation and inputVariable have NO CDIF target --
  verified 2026-11-24 by grepping every schema.yaml in metadataBuildingBlocks
  for each term, 0 hits. That is Disco's survey-instrumentation core and CDIF's
  blank spot. The honest landing place for them is schema:additionalProperty
  with a propertyID IRI, which is exactly the pattern caseQuantity already uses.

  Defects observed in the published specification (2026-06-26), each verified in
  the document text and worth raising with its editors rather than worked around
  here:

  * disco:product's range is given as http://purl.org/linked-data/cube#LogicalDataSet
    -- the Data Cube namespace with a Disco class name. It resolves to nothing.
  * disco:summaryStatisticType (section 7.3) vs disco:summaryStatisticsType
    (Vocabulary Reference). Only one can be the real IRI.
  * disco:responseDomain is listed under "11.2.1 Classes" (#10). It is an object
    property.
  * EXAMPLE 19 writes `a disco:Datafile`; the class is disco:DataFile.
  * EXAMPLE 26 writes disco:QuestionText for two of three questions; the
    property is disco:questionText.
  * The domain and range columns of the section 11 tables are blank for nearly
    every row.

  Out of scope, with rows recording why: disco:Mapping, disco:mapping,
  disco:context, disco:ddi-L-XPath and disco:ddi-L-Documentation are Disco's own
  meta-vocabulary for publishing its DDI-L mappings as RDF (section 11.1), not
  dataset content.

  Structural behaviour that is not a term-to-term mapping, so has no row: a CDIF
  catalog record is ADDED, and its dcterms:conformsTo is derived from content by
  detect_conformance rather than copied from the source.
